<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jadwal Try Out PAS kelas peserta DelLearn">
    <title>TO PAS — DelLearn Peserta</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="to-pas-saya" data-jenis="PAS">
    <div class="layout">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-logo"><span class="icon i-school" aria-hidden="true"></span></span>
                <p class="brand-title">DelLearn</p>
                <p class="brand-subtitle">LMS Bimbel SMP</p>
            </div>

            <!-- Menu Peserta diisi renderMenuRole() di assets/js/script.js -->
            <nav class="sidebar-nav" aria-label="Menu utama"></nav>

            <div class="sidebar-footer">
                <p class="semester-pill"><span class="status-dot" aria-hidden="true"></span>Semester Ganjil 2026/2027</p>
            </div>
        </aside>
        <div class="sidebar-backdrop" hidden></div>

        <div class="main">

            <!-- ================= HEADER ================= -->
            <header class="header">
                <button type="button" class="icon-btn icon-btn-ghost menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Buka menu navigasi">
                    <span class="icon i-menu" aria-hidden="true"></span>
                </button>
                <nav class="header-breadcrumb" aria-label="Lokasi portal">
                    <span class="crumb-root">Bimbingan Belajar SMP</span>
                    <span class="icon i-chevron-right icon-sm" aria-hidden="true"></span>
                    <a href="dashboard-peserta.html">Portal Peserta</a>
                </nav>

                <div class="header-right">
                    <span class="icon-btn icon-btn-ghost notif notif-status" role="img" aria-label="Belum ada notifikasi baru" title="Belum ada notifikasi baru">
                        <span class="icon i-bell" aria-hidden="true"></span>
                    </span>
                    <span class="header-divider" aria-hidden="true"></span>
                    <div class="profile">
                        <span class="avatar"><span class="icon i-user" aria-hidden="true"></span></span>
                        <div>
                            <p class="profile-name">–</p>
                            <p class="profile-role">Peserta</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- ================= CONTENT ================= -->
            <!-- Isi dirender initTOSayaPage() dari data TO kelas peserta (jenis dari <body data-jenis>) -->
            <main class="content">
                <div class="page-heading">
                    <div>
                        <h1 class="page-title">Try Out PAS</h1>
                        <p class="page-description" id="peserta-subjudul">–</p>
                    </div>
                </div>

                <p class="info-box" id="peserta-kosong" role="status" hidden></p>

                <div id="peserta-konten">
                    <!-- Pengerjaan TO: status, nilai, dan tombol mulai/lanjutkan/lihat hasil (kerjakan.html) -->
                    <section class="card to-aksi" aria-labelledby="to-saya-aksi-judul">
                        <div class="card-body">
                            <div>
                                <h2 class="card-title" id="to-saya-aksi-judul">Pengerjaan TO PAS</h2>
                                <p class="kerja-status" id="to-saya-status"></p>
                                <p class="card-subtitle" id="to-saya-status-info">–</p>
                            </div>
                            <a href="kerjakan.html" class="btn btn-primary" id="btn-to-saya" hidden>Mulai TO PAS</a>
                        </div>
                    </section>

                    <div class="grid-2">
                        <section class="card">
                            <header class="card-header">
                                <div>
                                    <h2 class="card-title">Detail Try Out</h2>
                                </div>
                            </header>
                            <div class="card-body">
                                <dl class="detail-list" id="to-saya-detail"></dl>
                            </div>
                        </section>
                        <section class="card">
                            <header class="card-header">
                                <div>
                                    <h2 class="card-title">Ketentuan</h2>
                                </div>
                            </header>
                            <div class="card-body">
                                <ul class="bullet-list" id="to-saya-ketentuan"></ul>
                            </div>
                        </section>
                    </div>
                </div>
                <noscript><p class="table-empty">Aktifkan JavaScript untuk menampilkan Try Out.</p></noscript>
            </main>

            <!-- ================= FOOTER ================= -->
            <footer class="footer">
                <p>© 2026 DelLearn · LMS Bimbingan Belajar SMP</p>
            </footer>

        </div>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
