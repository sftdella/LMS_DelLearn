<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kelas Saya — kelas bimbingan belajar yang diikuti peserta DelLearn">
    <title>Kelas Saya — DelLearn</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="kelas-saya">
    <div class="layout">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-logo"><span class="icon i-school" aria-hidden="true"></span></span>
                <p class="brand-title">DelLearn</p>
                <p class="brand-subtitle">LMS Bimbel SMP</p>
            </div>

            <!-- Menu Peserta diisi renderMenuRole() di assets/js/script.js -->
            <nav class="sidebar-nav" aria-label="Menu utama"></nav>

            <div class="sidebar-footer">
                <p class="semester-pill"><span class="status-dot" aria-hidden="true"></span>Semester Ganjil 2026/2027</p>
            </div>
        </aside>
        <div class="sidebar-backdrop" hidden></div>

        <div class="main">

            <!-- ================= HEADER ================= -->
            <header class="header">
                <button type="button" class="icon-btn icon-btn-ghost menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Buka menu navigasi">
                    <span class="icon i-menu" aria-hidden="true"></span>
                </button>
                <nav class="header-breadcrumb" aria-label="Lokasi portal">
                    <span class="crumb-root">Bimbingan Belajar SMP</span>
                    <span class="icon i-chevron-right icon-sm" aria-hidden="true"></span>
                    <a href="dashboard-peserta.html">Portal Peserta</a>
                </nav>

                <div class="header-right">
                    <span class="icon-btn icon-btn-ghost notif notif-status" role="img" aria-label="Belum ada notifikasi baru" title="Belum ada notifikasi baru">
                        <span class="icon i-bell" aria-hidden="true"></span>
                    </span>
                    <span class="header-divider" aria-hidden="true"></span>
                    <div class="profile">
                        <span class="avatar"><span class="icon i-user" aria-hidden="true"></span></span>
                        <div>
                            <p class="profile-name">–</p>
                            <p class="profile-role">Peserta</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- ================= CONTENT ================= -->
            <!-- Isi dirender initKelasSayaPage() dari kelas peserta yang login -->
            <main class="content">
                <p class="info-box" id="peserta-kosong" role="status" hidden></p>

                <div id="peserta-konten">
                    <section class="detail-header" aria-labelledby="ks-judul">
                        <div>
                            <p class="eyebrow">Kelas Saya</p>
                            <h1 id="ks-judul">–</h1>
                            <p class="detail-meta" id="ks-meta"></p>
                        </div>
                    </section>

                    <section class="card">
                        <header class="card-header">
                            <div>
                                <h2 class="card-title">Progress Pembelajaran</h2>
                                <p class="card-subtitle" id="ks-progress-text">–</p>
                            </div>
                        </header>
                        <div class="card-body">
                            <progress class="progress" id="ks-progress" value="0" max="100">0%</progress>
                        </div>
                    </section>

                    <section class="card">
                        <header class="card-header">
                            <div>
                                <h2 class="card-title">Daftar Pembelajaran</h2>
                                <p class="card-subtitle">Pertemuan 1–6 → TO PTS → Pertemuan 7–12 → TO PAS</p>
                            </div>
                        </header>
                        <div class="card-body">
                            <ol class="meeting-list" id="ks-pertemuan"></ol>
                        </div>
                    </section>
                </div>
                <noscript><p class="table-empty">Aktifkan JavaScript untuk menampilkan kelas Anda.</p></noscript>
            </main>

            <!-- ================= FOOTER ================= -->
            <footer class="footer">
                <p>© 2026 DelLearn · LMS Bimbingan Belajar SMP</p>
            </footer>

        </div>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
