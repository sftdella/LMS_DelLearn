<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Masuk ke DelLearn — LMS Bimbingan Belajar SMP">
    <title>Masuk — DelLearn</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- Login simulasi (frontend saja): akun demo & session disimpan di browser, bukan keamanan server -->
<body data-page="login" class="login-page">
    <main class="login-main">
        <section class="card login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <span class="brand-logo"><span class="icon i-school" aria-hidden="true"></span></span>
                <div>
                    <p class="brand-title">DelLearn</p>
                    <p class="login-subtitle">LMS Bimbingan Belajar SMP</p>
                </div>
            </div>

            <h1 class="login-title" id="login-title">Masuk ke Akun Anda</h1>
            <p class="page-description">Gunakan akun Admin, Pengajar, atau Peserta.</p>

            <form class="login-form" id="form-login" novalidate>
                <div class="alert alert-error" id="login-alert" role="alert" hidden>
                    <span class="icon i-info" aria-hidden="true"></span>
                    <span id="login-alert-text"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-identitas">Email / ID Pengguna</label>
                    <input type="text" id="login-identitas" name="identitas" class="form-control" autocomplete="username" placeholder="Contoh: admin@dellearn.id" aria-describedby="identitas-error" required>
                    <p class="form-error" id="identitas-error"></p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="password-field">
                        <input type="password" id="login-password" name="password" class="form-control" autocomplete="current-password" placeholder="Masukkan password" aria-describedby="password-error" required>
                        <button type="button" class="icon-btn icon-btn-ghost icon-btn-small password-toggle" id="btn-lihat-password" aria-label="Tampilkan password" aria-pressed="false"><span class="icon i-eye" aria-hidden="true"></span></button>
                    </div>
                    <p class="form-error" id="password-error"></p>
                </div>

                <button type="submit" class="btn btn-primary login-submit"><span class="icon i-lock" aria-hidden="true"></span>Masuk</button>
            </form>

            <!-- Akun demo: klik untuk mengisi form (tidak membuat akun baru) -->
            <section class="demo-box" aria-labelledby="demo-title">
                <p class="demo-title" id="demo-title">Demo Login DelLearn</p>
                <div class="demo-list">
                    <button type="button" class="demo-akun" data-demo="admin">
                        <span class="demo-role">Admin</span>
                        <span class="demo-cred">Email: admin@dellearn.id · Password: admin123</span>
                    </button>
                    <button type="button" class="demo-akun" data-demo="pengajar">
                        <span class="demo-role">Pengajar</span>
                        <span class="demo-cred">Email: pengajar@dellearn.id · Password: guru123</span>
                    </button>
                    <button type="button" class="demo-akun" data-demo="peserta">
                        <span class="demo-role">Peserta</span>
                        <span class="demo-cred">Email: peserta@dellearn.id · Password: siswa123</span>
                    </button>
                </div>
            </section>

            <p class="login-note">Login ini simulasi frontend untuk keperluan tugas, bukan sistem keamanan sungguhan.</p>
            <noscript><p class="login-note">Aktifkan JavaScript untuk masuk ke DelLearn.</p></noscript>
        </section>
    </main>

    <script src="../assets/js/script.js"></script>
</body>
</html>
